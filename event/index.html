<body>

<header class="top">
  <div class="wrap top__in">
    <a class="top__id" href="/">
      <img class="top__mark" src="../assets/app-icon.png" width="28" height="28" alt="" decoding="async">
      JAMIT
    </a>
    <nav class="top__nav"><a href="/">소개</a></nav>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h1 class="card__title">내 응모권 확인</h1>
    <p class="card__lede">닉네임을 넣으면 응모권이 확정인지, 심사 중인지, 반려인지 볼 수 있어요.</p>

    <form class="lookup" id="form">
      <input class="lookup__input" id="nickname" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="닉네임" aria-label="닉네임">
      <button class="btn" id="submit" type="submit">조회</button>
    </form>

    <p class="msg" id="message" role="alert" hidden></p>

    <section class="result" id="result" hidden>
      <p class="notice" id="drawn" hidden>추첨이 끝났어요</p>
      <h2 class="who"><mark id="who-name"></mark>님의 응모권</h2>
      <p class="summary" id="summary" aria-live="polite"></p>
      <p class="period" id="period"></p>
      <p class="rule" id="rule" hidden>확정된 응모권 중 추첨일까지 7일 이상 계속 공개한 영상만 추첨에 들어가요. 중간에 숨기면 다시 공개한 날부터 7일을 새로 채워야 해요.</p>
      <ul class="tickets" id="list"></ul>
    </section>
  </div>
</main>

<footer class="wrap foot">
  <div class="foot__in">
    <span>© JAMIT</span>

  <p class="foot__ack">이 성과는 2026년도 과학기술정보통신부의 재원으로 정보통신기획평가원의 지원을 받아 수행된 결과물임 (IITP-2026-AI·SW마에스트로)</p>
</footer>

</body>
