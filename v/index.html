<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover — /s/index.html과 같은 이유다: 공유 링크는 거의 전부 노치 기기의
     인앱 브라우저에서 열린다. 인과는 그쪽 주석이 정본이다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잇츠 공유 — JAMIT</title>
<meta name="description" content="JAMIT 잇츠 공유 링크입니다. 링크를 눌러 앱에서 이 합주 영상을 볼 수 있습니다.">
<!-- 색인은 막는다 — /s/와 같은 판단: 1:1로 전달되는 링크라 검색에서 만날 일이 없고,
     id 없이 열리는 /v/ 는 안내 문구뿐이다. canonical은 쿼리를 뗀 주소다 -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://jamit.kr/v/">
<meta name="theme-color" content="#ecedf1">

<!-- OG는 잇츠마다 다르게 만들 수 없다 — /s/와 같은 제약(정적 호스팅 + 크롤러는 JS를 안 돌린다).
     문구 한 벌만 두고, 썸네일은 사람이 눌러 들어온 뒤에 API로 받아 그린다 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="JAMIT">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://jamit.kr/v/">
<meta property="og:title" content="JAMIT 잇츠를 공유받았습니다">
<meta property="og:description" content="여러 사람의 연주가 하나로 합쳐진 합주 영상이에요. 링크를 눌러 앱에서 보세요.">
<meta property="og:image" content="https://jamit.kr/assets/og.jpg?v=3">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="JAMIT — 나만의 연주가 우리의 합주로. 앱 홈 화면과 녹화 화면.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/jetbrains-mono-latin.woff2" crossorigin>
<link rel="preload" href="../assets/fonts/pretendard-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="../assets/icon-180.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

<!-- ══════════════════════════════════════════════════════════
     링크 판정 — <style>보다 앞, head 안에서 돈다. /s/와 같은 이유다:
     상태 class가 첫 그리기 전에 붙어야 오류 문구가 번쩍이지 않는다.
     여기서는 판정만 하고 DOM은 아래 DOMContentLoaded에서 만진다.
     ══════════════════════════════════════════════════════════ -->
<script>
(() => {
  /* ════ 바꿀 곳은 이 세 줄과 en/v/·ja/v/ 사본의 같은 줄이다 ════
     INSTALL_URL — App Store 주소.
     API_BASE    — 썸네일을 주는 백엔드. 앱(TestFlight)이 스테이징을 보는 동안은 여기도
                   스테이징이어야 한다 — 링크의 id는 앱이 보는 DB의 것이라, 운영을 물으면
                   맞는 id가 전부 404로 떨어진다. 앱이 운영으로 넘어가는 날 함께 바꾼다.
     SCHEME_BASE — 앱이 받는 딥링크. iOS ShortformShareRoute가 이 모양을 파싱한다 —
                   바꾸려면 그쪽과 함께 바꿔야 한다(주소의 정본은 앱 쪽 주석 참조) */
  const INSTALL_URL = "https://apps.apple.com/kr/app/jamit-%EB%82%98%EB%A7%8C%EC%9D%98-%EC%97%B0%EC%A3%BC%EA%B0%80-%EC%9A%B0%EB%A6%AC%EC%9D%98-%ED%95%A9%EC%A3%BC%EB%A1%9C/id6801850526";
  const API_BASE = "https://api-stg.jamit.kr";
  const SCHEME_BASE = "jamit://shortform/watch?id=";

  /* id는 쿼리스트링으로 받는다 — /v/123 경로 세그먼트는 GitHub Pages가 못 준다(/s/ 주석).
     숫자만 통과시킨다: DB 순번 id라 형식이 이것뿐이고, 여기서 거르면 아래에서 URL에 그대로
     이어 붙여도 안전하다. 상한 18자리는 Long 범위 안이면서 손상된 링크를 거르는 값이다 */
  const raw = (new URLSearchParams(location.search).get("id") || "").trim();
  const ok = /^\d{1,18}$/.test(raw);
  const id = ok ? raw : null;

  /* 공유자 이름 — 서버는 공유자가 누군지 모르므로(무인증 미리보기의 응답은 썸네일뿐)
     앱이 링크에 실어 보낸다. 화면에 textContent로만 넣으므로 값이 무엇이든 스크립트가 되지
     않지만, 길이만은 여기서 자른다 — 손으로 고친 링크가 문장 하나를 통째로 실어 올 수 있다.
     자르기는 글자 단위다(스프레드) — 코드유닛으로 자르면 이모지 한가운데가 잘려 끝이 �가 된다 */
  const from = [...(new URLSearchParams(location.search).get("from") || "").trim()]
    .slice(0, 20).join("");

  /* 스페이스 잇츠 표식 — 이것도 앱이 링크에 싣는다. 서버에 물어봐도 알 수 없다:
     비공개는 미리보기 API가 존재조차 갈라 말하지 않는 404라, 「비공개 스페이스의 잇츠」와
     「없는 잇츠」가 응답으로 구분되지 않는다. 표식이 있으면 썸네일 요청을 아예 보내지 않는다 */
  const inSpace = new URLSearchParams(location.search).get("s") === "1";

  if (ok) document.documentElement.classList.add("has-its");
  if (inSpace) document.documentElement.classList.add("in-space");
  /* 문구 두 벌(이름 있음/없음)을 가르는 클래스도 첫 그리기 전에 — has-its와 같은 이유다:
     늦게 붙이면 익명 문구가 한 프레임 보였다 바뀐다. 글자 채우기만 아래(DOM 생긴 뒤)에 남는다 */
  if (ok && from) document.documentElement.classList.add("has-from");

  addEventListener("DOMContentLoaded", () => {
    /* 설치 버튼은 id와 무관하게 늘 채운다 — /s/와 같은 이유(href가 비면 안 된다).
       안내 화면의 것까지 여기서 채우므로 주소를 바꿀 곳은 위 한 줄(과 사본의 같은 줄)이다 */
    document.getElementById("install").href = INSTALL_URL;
    document.getElementById("install2").href = INSTALL_URL;
    if (!ok) return;

    const deepLink = SCHEME_BASE + id;
    document.getElementById("open").href = deepLink;

    if (from) {
      /* textContent다 — innerHTML로 바꾸면 이 줄이 XSS 주입구가 된다(값이 링크에서 온다) */
      document.getElementById("from-name").textContent = from;
    }

    /* ── 자동으로 앱을 연다 — /s/가 일부러 안 하는 것을 여기는 한다 ──
       /s/의 근거(카카오 인앱이 사용자가 누르지 않은 스킴 이동을 막거나 경고를 띄운다)는
       사실이고 그대로다. 갈린 것은 손익 계산이다: 초대 코드는 어차피 앱 안에서 손으로도
       넣을 수 있어 자동 이동이 아껴 주는 것이 탭 한 번인데, 잇츠는 「누르면 바로 영상」이
       기대라 그 한 번이 경험의 전부다. 앱이 있는 사람은 찰나에 넘어가고(인스타 공유 링크의
       그 동작), 없는 사람이 보는 경고는 닫으면 이 페이지 그대로라 잃는 것이 버튼 UI뿐이다.
       그래서 버튼을 지우지 않는다 — 자동 이동이 막히는 환경의 회복 경로가 이 버튼이다.

       모바일에서만 시도한다: 데스크톱은 jamit:// 을 받는 앱이 있을 수 없어 경고만 남는다.
       iPadOS 13+ 사파리는 데스크톱 UA(Macintosh)를 내서 이 검사에 안 걸린다 — 알고 둔다:
       아이패드는 자동 이동 없이 버튼으로 열면 되고, 맥을 아이패드로 오인해 경고를 세우는
       것보다 그쪽이 싸다. 카카오·인스타 인앱도 UA로 갈라 빼지 않는다 — 인앱 브라우저의
       UA는 믿을 게 못 되고(앱마다 제멋대로 꾸민다), 막히는 환경에서는 위 계산대로 잃는 것이 없다 */
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      location.href = deepLink;
    }

    /* ── 썸네일 — 없어도 페이지는 완성이다 ──
       기본 화면(어두운 판 + 재생 글리프)이 폴백이 아니라 원판이고, 썸네일은 도착하면 그 위를
       덮는 장식이다. 그래서 실패를 사용자에게 알리지 않는다: 404(내려간 잇츠)·CORS 미개방·
       서명 실패(thumbnailUrl 없음) 전부 같은 무signal이고, 어느 쪽이든 「앱에서 열기」라는
       이 페이지의 일은 그대로 성립한다.
       스페이스 잇츠는 요청 자체를 보내지 않는다 — 미리보기 API는 공개본만 열므로(위 주석)
       확정된 404를 물으러 갈 이유가 없다 */
    if (!inSpace) {
      fetch(API_BASE + "/api/v1/shortforms/" + id + "/share-preview")
        .then((r) => (r.ok ? r.json() : null))
        .then((body) => {
          const url = body && body.data && body.data.thumbnailUrl;
          if (!url) return;
          const img = document.getElementById("thumb");
          /* onload 뒤에만 보인다 — src만 넣고 바로 보이면 로딩 중 깨진 그림 아이콘이 선다 */
          img.addEventListener("load", () => img.classList.add("thumb--on"));
          img.src = url;
        })
        .catch(() => {});
    }
  });
})();
</script>

<!-- Clarity를 넣지 않는 것은 /s/와 결이 같지만 근거는 다르다 — 여기는 자격증명이 실리지
     않아 /s/만큼 위험하지 않다. 그래도 빼는 이유: 태그가 든 파일은 index.html 하나라는
     규칙이 이미 서 있고, 이 페이지가 그 규칙을 깰 만큼 계측이 급하지 않다 -->

<style>
@font-face{
  font-family:"Pretendard";
  src:url("../assets/fonts/pretendard-subset.woff2") format("woff2");
  font-weight:400 800;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"MonoEn";
  font-weight:100 500;
  src:local("SFMono-Regular"),local("SF Mono Regular"),local("Menlo-Regular"),
      url("../assets/fonts/jetbrains-mono-latin.woff2") format("woff2");
  font-display:swap;
  unicode-range:U+0030-0039, U+0041-005A, U+0061-007A;
}
@font-face{
  font-family:"MonoEn";
  font-weight:600 900;
  src:local("SFMono-Bold"),local("SF Mono Bold"),local("Menlo-Bold"),
      url("../assets/fonts/jetbrains-mono-latin.woff2") format("woff2");
  font-display:swap;
  unicode-range:U+0030-0039, U+0041-005A, U+0061-007A;
}
@font-face{
  font-family:"MonoAll";
  font-weight:100 500;
  src:local("SFMono-Regular"),local("SF Mono Regular"),local("Menlo-Regular"),
      url("../assets/fonts/jetbrains-mono-latin.woff2") format("woff2");
  font-display:swap;
}
@font-face{
  font-family:"MonoAll";
  font-weight:600 900;
  src:local("SFMono-Bold"),local("SF Mono Bold"),local("Menlo-Bold"),
      url("../assets/fonts/jetbrains-mono-latin.woff2") format("woff2");
  font-display:swap;
}
/* 토큰·상단 바·버튼(위 여백만 다르다)·배지·푸터는 /s/index.html 과 같은 값이다 — 세 공유 페이지가 갈라 보이면
   같은 사이트로 안 보인다. 옛 전단지 규칙(각진 카드·잉크 오프셋 그림자·종이 결·압정)은 버렸다 */
:root{
  --paper:#ecedf1;
  --paper-2:#fff;
  --ink:#1a1f2b;              /* 종이 대비 14.1:1 */
  --ink-2:#4b5468;            /* 6.5:1 */
  --mute:#5f6779;             /* 4.7:1 */
  --hot:#3a5fd1;              /* 4.8:1 (종이) */
  --mark:#bfd6ff;
  --line:rgba(26,31,43,.12);
  --edge:max(clamp(20px,7vw,120px),env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));
  --sans:"MonoEn","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"MonoAll",ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,"Pretendard",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{
  font-family:var(--sans);color:var(--ink);line-height:1.6;word-break:keep-all;
  background:var(--paper);-webkit-font-smoothing:antialiased;overflow-x:clip;
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
img,svg{display:block}
::selection{background:var(--mark);color:var(--ink)}
.wrap{width:min(1240px,calc(100% - var(--edge)*2));margin-inline:auto}
h1{font-weight:800;letter-spacing:-.03em;line-height:1.18;text-wrap:balance}
p{text-wrap:pretty}

.top{background:var(--paper);border-bottom:1px solid var(--line)}
.top__in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0}
.top__id{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.03em}
.top__mark{display:block;border-radius:22.5%}
.top__nav a{font-size:14px;font-weight:500;color:var(--ink-2)}
.top__nav a:hover{color:var(--ink)}

main{flex:1;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:clamp(32px,8vw,80px) 0}
.card{width:min(480px,100%);margin-inline:auto;text-align:center;
  background:var(--paper-2);border-radius:clamp(24px,5vw,36px);
  padding:clamp(32px,7vw,48px) clamp(20px,6vw,44px);
  box-shadow:0 1px 2px rgba(26,31,43,.04),0 24px 60px -28px rgba(26,31,43,.22)}
.kick{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--hot)}
.card__title{margin-top:12px;font-size:clamp(28px,7vw,38px)}
.card__lede{margin-top:14px;color:var(--ink-2);font-size:clamp(15px,1.4vw,16px);line-height:1.7}

/* 공유 문구 — 정상 화면의 유일한 제목이라 h1 이지만, 이름이 들어가는 문장이라 안내 화면 제목보다
   한 단계 작게 둔다. 이름은 메인 히어로의 「합주」와 같은 형광펜 밑줄로 든다 */
.card__msg{font-size:clamp(20px,5.4vw,26px);line-height:1.4;letter-spacing:-.02em;
  /* 닉네임은 12자까지라 keep-all 로는 「이름+님이」 한 덩어리가 320 폭 카드를 밀어낸다 */
  overflow-wrap:anywhere}
/* 문장마다 따로 균형을 잡는다 — <br> 하나로 이으면 balance 가 앞 문장에만 걸려
   뒤 문장 끝에 낱말 하나(「app」)가 혼자 떨어진다 */
.card__line{display:block;text-wrap:balance}
.card__msg mark{color:inherit;padding:0 2px;
  background:linear-gradient(var(--mark),var(--mark)) 0 76%/100% 44% no-repeat}
/* 이름이 없으면 문장째 바뀐다 — 「님이」가 주어 없이 남지 않게 두 벌을 통째로 갈아 끼운다 */
.card__msg--named{display:none}
.has-from .card__msg--named{display:block}
.has-from .card__msg--anon{display:none}

.btn{display:flex;width:min(240px,100%);height:46px;align-items:center;justify-content:center;gap:9px;
  margin:24px auto 0;padding:0 20px;font:inherit;font-size:16px;font-weight:700;letter-spacing:-.01em;
  background:var(--hot);color:#fff;border:0;border-radius:999px;cursor:pointer;
  transition:transform .16s ease,filter .16s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}

.stores{display:grid;grid-template-columns:336fr 379fr;gap:12px;max-width:306px;margin:20px auto 0}
/* 안내 화면에는 위에 버튼이 없어 본문과 바로 붙는다 — 버튼이 서던 만큼 띄운다 */
.card__bad .stores{margin-top:24px}
.badge{display:block;line-height:0;border-radius:8px;transition:opacity .2s ease,transform .2s ease}
.badge:hover{opacity:.85}
.badge:active{transform:scale(.97)}
.badge img{width:100%;height:auto}
.badge:focus-visible{outline:2px solid var(--hot);outline-offset:4px}

/* 썸네일 액자 — 9:16. 기본 화면(어두운 판 + 재생 글리프)이 원판이고 썸네일 <img>는 API가 답한
   뒤에야 그 위를 덮는다(.thumb--on). object-fit:cover라 서버가 어떤 비율을 주든 액자가 흔들리지 않는다 */
.frame{position:relative;margin:0 auto 24px;width:min(200px,54vw);aspect-ratio:9/16;
  background:#0f1115;border-radius:20px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  box-shadow:0 18px 40px -22px rgba(15,17,21,.6)}
.frame__thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .25s}
.frame__thumb.thumb--on{opacity:1}
.frame__play{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.14)}
.frame__space{display:none;padding:0 14px;font-size:12px;line-height:1.6;color:#9aa3b5}
.in-space .frame__space{display:block}

/* 상태 전환 — 기본값이 「안내」다. JS가 죽으면 id도 못 읽은 것이므로 빈 카드가 아니라
   안내가 남아야 하고, 성공했을 때만 head 스크립트가 has-its로 뒤집는다 */
.card__ok{display:none}
.has-its .card__ok{display:block}
.has-its .card__bad{display:none}

.foot{border-top:1px solid var(--line);padding:30px 0 calc(30px + env(safe-area-inset-bottom,0px));
  font-size:13px;color:var(--mute)}
.foot__in{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}
.foot__in nav{display:flex;flex-wrap:wrap;gap:6px 16px}
/* 링크 하나가 단어 중간에서 꺾이지 않게 — 일본어는 320 폭에서 「お問い合わ/せ」로 갈렸다 */
.foot__in a{display:inline-block;padding:6px 4px;margin:-6px -4px;white-space:nowrap}
.foot a:hover{color:var(--ink)}
.foot__ack{margin:12px 0 0;font-size:11px;line-height:1.5;word-break:keep-all}

@media(max-width:860px){
  .foot__in a{padding:12px 4px;margin:-12px 0}
  /* 링크가 두 줄로 접히면 위아래 누름 영역(45px)이 겹치지 않을 만큼 벌린다 */
  .foot__in nav{row-gap:24px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top__in">
    <a class="top__id" href="/">
      <img class="top__mark" src="../assets/app-icon.png" width="28" height="28" alt="" decoding="async">
      JAMIT
    </a>
    <nav class="top__nav"><a href="/">소개</a></nav>
  </div>
</header>

<main class="wrap">
  <!-- ══════════ 공유 카드 ══════════ 링크가 읽혔을 때와 아닐 때, 두 벌이 한 카드 안에 있다 -->
  <div class="card">
    <div class="card__ok">
      <!-- 썸네일 액자. img의 alt가 비어 있는 것은 장식이라서다 — 내용은 아래 문구가 다 말한다 -->
      <div class="frame">
        <img class="frame__thumb" id="thumb" alt="">
        <span class="frame__play" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 22 22"><polygon points="7,4 19,11 7,18" fill="#fff"/></svg></span>
        <p class="frame__space">비공개 스페이스에서<br>올라온 잇츠입니다</p>
      </div>
      <h1 class="card__msg card__msg--named"><span class="card__line"><mark id="from-name"></mark>님이 이 잇츠를</span><span class="card__line">회원님과 공유했습니다</span></h1>
      <h1 class="card__msg card__msg--anon"><span class="card__line">잇츠를 공유받았습니다</span><span class="card__line">앱에서 이 합주 영상을 볼 수 있어요</span></h1>
      <!-- href는 head 스크립트가 딥링크로 채운다 -->
      <a class="btn" id="open" href="#">JAMIT 열기 <span aria-hidden="true">→</span></a>
      <!-- App Store 는 head 의 INSTALL_URL 을 JS가 넣고, Google Play 는 여기 적힌 그대로다(en/·ja/ 사본은 hl 만 다르다) -->
      <div class="stores">
        <a class="badge" id="install" href="#"><img src="../assets/app-store.webp" width="336" height="112" alt="App Store 에서 다운로드" decoding="async"></a>
        <a class="badge" href="https://play.google.com/store/apps/details?id=kr.jamit.app&amp;hl=ko"><img src="../assets/google-play.webp" width="379" height="112" alt="Google Play 에서 다운로드" decoding="async"></a>
      </div>
    </div>

    <div class="card__bad">
      <p class="kick">잇츠 공유</p>
      <h1 class="card__title">링크를<br>읽지 못했습니다</h1>
      <p class="card__lede">받은 링크를 그대로 다시 눌러 주세요. 링크를 옮겨 적는 과정에서 주소 뒷부분이 잘리면 어떤 잇츠인지 알 수 없게 됩니다.</p>
      <div class="stores">
        <a class="badge" id="install2" href="#"><img src="../assets/app-store.webp" width="336" height="112" alt="App Store 에서 다운로드" decoding="async"></a>
        <a class="badge" href="https://play.google.com/store/apps/details?id=kr.jamit.app&amp;hl=ko"><img src="../assets/google-play.webp" width="379" height="112" alt="Google Play 에서 다운로드" decoding="async"></a>
      </div>
    </div>
  </div>
</main>

<footer class="wrap foot">
  <div class="foot__in">
    <span>© JAMIT</span>
    <nav>
      <a href="mailto:support@jamit.kr">문의</a>
      <a href="/privacy.html">개인정보처리방침</a>
      <a href="/terms.html">이용약관</a>
    </nav>
  </div>
  <p class="foot__ack">이 성과는 2026년도 과학기술정보통신부의 재원으로 정보통신기획평가원의 지원을 받아 수행된 결과물임 (IITP-2026-AI·SW마에스트로)</p>
</footer>

</body>
</html>
